<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta name="theme-color" content="#004165">

  <title>Meeting Timer | Jaipur Speakers Toastmasters Club</title>

  <style>

    :root {
      --loyal-blue: #004165;
      --true-maroon: #772432;
      --cool-gray: #A9B2B1;

      --white: #FFFFFF;
      --black: #222222;

      --signal-green: #3F7D20;
      --signal-yellow: #D99A00;
      --signal-red: #C62828;

      --light-background: #F4F5F5;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      font-family:
        "Source Sans 3",
        "Source Sans Pro",
        Arial,
        sans-serif;

      background: var(--light-background);
      color: var(--black);

      transition:
        background-color 0.3s ease,
        color 0.3s ease;
    }

    /* =====================================================
       APP
       ===================================================== */

    .app {
      width: 100%;
      min-height: 100vh;
      max-width: 900px;

      margin: 0 auto;

      background: var(--white);

      transition:
        background-color 0.3s ease;
    }


    /* =====================================================
       MINIMAL HEADER
       ===================================================== */

    .header {
      padding: 10px 12px 7px;

      background: transparent;
      color: var(--loyal-blue);

      text-align: left;
    }

    .header h1 {
      margin: 0;

      font-size: 20px;
      line-height: 1.1;
      font-weight: 700;
    }

    .header p {
      margin: 2px 0 0;

      color: #666666;

      font-size: 12px;
    }


    /* =====================================================
       MAIN
       ===================================================== */

    .main {
      width: 100%;
      padding: 7px 10px 12px;

      background: var(--white);

      transition:
        background-color 0.3s ease;
    }


    /* =====================================================
       PRESET PILLS
       ===================================================== */

    .presets {
      display: flex;

      gap: 8px;

      margin-bottom: 10px;

      overflow-x: auto;

      padding-bottom: 2px;

      scrollbar-width: none;

      -webkit-overflow-scrolling: touch;
    }

    .presets::-webkit-scrollbar {
      display: none;
    }

    .preset {
      flex: 0 0 auto;

      min-height: 42px;

      padding: 9px 15px;

      border: 0;
      border-radius: 999px;

      background: #E7ECEF;
      color: var(--loyal-blue);

      font: inherit;
      font-size: 14px;
      font-weight: 700;

      white-space: nowrap;

      cursor: pointer;
      touch-action: manipulation;
    }

    .preset.active {
      background: var(--loyal-blue);
      color: var(--white);
    }

    .preset:active {
      opacity: 0.75;
    }

    .preset span {
      display: inline;

      margin-left: 3px;

      font-size: 13px;
      font-weight: 600;
    }


    /* =====================================================
       SPEAKER INPUT
       ===================================================== */

    .speaker {
      display: block;

      width: 100%;

      margin-bottom: 10px;

      padding: 11px 12px;

      border: 1px solid var(--cool-gray);
      border-radius: 4px;

      background: var(--white);
      color: var(--black);

      font: inherit;
      font-size: 16px;

      outline: none;
    }

    .speaker:focus {
      border-color: var(--loyal-blue);
    }


    /* =====================================================
       TIMER CARD
       ===================================================== */

    .timer-card {
      width: 100%;

      padding: 18px 8px 22px;

      border: 5px solid var(--loyal-blue);
      border-radius: 6px;

      background: var(--white);

      text-align: center;

      transition:
        background-color 0.3s ease,
        border-color 0.3s ease;
    }

    .speaker-name {
      min-height: 27px;

      color: var(--loyal-blue);

      font-size: 20px;
      font-weight: 700;

      transition: color 0.3s ease;
    }

    .signal {
      min-height: 28px;

      margin-top: 3px;

      color: var(--loyal-blue);

      font-size: 18px;
      font-weight: 800;

      letter-spacing: 0.1em;
      text-transform: uppercase;

      transition: color 0.3s ease;
    }

    .timer {
      margin: 10px 0;

      color: var(--loyal-blue);

      font-size: clamp(90px, 24vw, 175px);

      line-height: 0.86;

      font-weight: 800;

      font-variant-numeric: tabular-nums;

      letter-spacing: -0.02em;

      transition: color 0.3s ease;
    }

    .timing-info {
      min-height: 25px;

      color: #555555;

      font-size: 15px;

      transition: color 0.3s ease;
    }


    /* =====================================================
       SIGNAL LIGHTS
       ===================================================== */

    .lights {
      display: flex;

      justify-content: center;

      gap: 12px;

      margin-top: 17px;
    }

    .light {
      width: 46px;
      height: 46px;

      border: 3px solid currentColor;
      border-radius: 50%;

      opacity: 0.16;
    }

    .light.green {
      color: var(--signal-green);
    }

    .light.yellow {
      color: var(--signal-yellow);
    }

    .light.red {
      color: var(--signal-red);
    }

    .light.active {
      opacity: 1;
    }

    .light.green.active {
      background: var(--signal-green);
    }

    .light.yellow.active {
      background: var(--signal-yellow);
    }

    .light.red.active {
      background: var(--signal-red);
    }


    /* =====================================================
       MINIMAL CONTROLS
       ===================================================== */

    .controls {
      display: grid;

      grid-template-columns:
        1.5fr
        1fr
        1fr
        1fr;

      gap: 6px;

      margin-top: 10px;
    }

    button.control {
      min-height: 44px;

      padding: 8px 6px;

      border: 1px solid rgba(0, 0, 0, 0.12);
      border-radius: 4px;

      background: rgba(255, 255, 255, 0.82);

      color: var(--loyal-blue);

      font: inherit;
      font-size: 14px;
      font-weight: 700;

      cursor: pointer;
      touch-action: manipulation;
    }

    button.control:active {
      opacity: 0.8;
    }

    button.maroon {
      color: var(--true-maroon);
    }

    button.gray {
      background: rgba(255, 255, 255, 0.65);
      color: var(--black);
    }


    /* =====================================================
       TIME ADJUSTMENT
       ===================================================== */

    .adjust {
      display: grid;

      grid-template-columns: 1fr 1fr;

      gap: 6px;

      margin-top: 6px;
    }

    .adjust button {
      min-height: 38px;

      padding: 8px;

      border: 1px solid rgba(0, 0, 0, 0.10);
      border-radius: 4px;

      background: rgba(255, 255, 255, 0.60);

      color: var(--black);

      font: inherit;
      font-size: 13px;
      font-weight: 600;

      cursor: pointer;
      touch-action: manipulation;
    }


    /* =====================================================
       CUSTOM TIMING
       ===================================================== */

    .custom {
      margin-top: 19px;
      padding-top: 17px;

      border-top: 1px solid #dddddd;
    }

    .custom h2 {
      margin: 0 0 10px;

      color: var(--loyal-blue);

      font-size: 20px;
    }

    .custom-grid {
      display: grid;

      grid-template-columns:
        1fr
        1fr
        1fr
        auto;

      gap: 7px;

      align-items: end;
    }

    .field label {
      display: block;

      margin-bottom: 4px;

      font-size: 13px;
      font-weight: 700;
    }

    .field input {
      width: 100%;

      padding: 10px;

      border: 1px solid var(--cool-gray);
      border-radius: 4px;

      font: inherit;
      font-size: 16px;
    }

    .apply {
      min-height: 43px;

      padding: 10px 15px;

      border: 0;
      border-radius: 4px;

      background: var(--true-maroon);
      color: var(--white);

      font: inherit;
      font-weight: 700;

      cursor: pointer;
      touch-action: manipulation;
    }


    /* =====================================================
       FOOTER
       ===================================================== */

    .footer {
      padding: 10px;

      background: var(--loyal-blue);
      color: var(--white);

      text-align: center;

      font-size: 12px;
    }


    /* =====================================================
       WHOLE PAGE GREEN
       ===================================================== */

    body.state-green {
      background: var(--signal-green);
    }

    body.state-green .app,
    body.state-green .main,
    body.state-green .timer-card {
      background: var(--signal-green);
    }

    body.state-green .timer-card {
      border-color: var(--white);
    }

    body.state-green .speaker-name,
    body.state-green .signal,
    body.state-green .timer,
    body.state-green .timing-info {
      color: var(--white);
    }


    /* =====================================================
       WHOLE PAGE YELLOW
       ===================================================== */

    body.state-yellow {
      background: var(--signal-yellow);
    }

    body.state-yellow .app,
    body.state-yellow .main,
    body.state-yellow .timer-card {
      background: var(--signal-yellow);
    }

    body.state-yellow .timer-card {
      border-color: var(--white);
    }

    body.state-yellow .speaker-name,
    body.state-yellow .signal,
    body.state-yellow .timer,
    body.state-yellow .timing-info {
      color: var(--white);
    }


    /* =====================================================
       WHOLE PAGE RED
       ===================================================== */

    body.state-red {
      background: var(--signal-red);
    }

    body.state-red .app,
    body.state-red .main,
    body.state-red .timer-card {
      background: var(--signal-red);
    }

    body.state-red .timer-card {
      border-color: var(--white);
    }

    body.state-red .speaker-name,
    body.state-red .signal,
    body.state-red .timer,
    body.state-red .timing-info {
      color: var(--white);
    }


    /* =====================================================
       OVERTIME
       ===================================================== */

    body.state-overtime {
      background: var(--true-maroon);
    }

    body.state-overtime .app,
    body.state-overtime .main,
    body.state-overtime .timer-card {
      background: var(--true-maroon);
    }

    body.state-overtime .timer-card {
      border-color: var(--white);
    }

    body.state-overtime .speaker-name,
    body.state-overtime .signal,
    body.state-overtime .timer,
    body.state-overtime .timing-info {
      color: var(--white);
    }


    /* =====================================================
       SUBTLE CONTROLS ON COLOURED BACKGROUND
       ===================================================== */

    body.state-green .controls button,
    body.state-yellow .controls button,
    body.state-red .controls button,
    body.state-overtime .controls button,
    body.state-green .adjust button,
    body.state-yellow .adjust button,
    body.state-red .adjust button,
    body.state-overtime .adjust button {
      background: rgba(255, 255, 255, 0.82);
      color: var(--black);
    }


    /* =====================================================
       MEETING MODE
       
       This is NOT dependent on browser fullscreen.
       It works inside an iframe.
       ===================================================== */

    body.meeting-mode {
      padding: 0;

      min-height: 100vh;

      overflow: hidden;
    }


    body.meeting-mode .header,
    body.meeting-mode .presets,
    body.meeting-mode .speaker,
    body.meeting-mode .controls,
    body.meeting-mode .adjust,
    body.meeting-mode .custom,
    body.meeting-mode .footer,
    body.meeting-mode .timing-info,
    body.meeting-mode .lights {
      display: none;
    }


    body.meeting-mode .app,
    body.meeting-mode .main {
      width: 100%;

      max-width: none;

      min-height: 100vh;

      padding: 0;

      background: transparent;
    }


    body.meeting-mode .timer-card {
      width: 100%;

      min-height: 100vh;

      padding: 15px;

      border: 0;

      border-radius: 0;

      background: transparent;

      display: flex;

      flex-direction: column;

      align-items: center;

      justify-content: center;
    }


    body.meeting-mode .speaker-name {
      color: var(--white);

      font-size:
        clamp(22px, 6vw, 44px);
    }


    body.meeting-mode .signal {
      color: var(--white);

      font-size:
        clamp(21px, 6vw, 42px);

      letter-spacing: 0.12em;
    }


    body.meeting-mode .timer {
      color: var(--white);

      font-size:
        clamp(120px, 31vw, 360px);

      line-height: 0.82;

      margin: 18px 0;
    }


    /* =====================================================
       MEETING MODE COLOUR STATES
       ===================================================== */

    body.meeting-mode.state-green,
    body.meeting-mode.state-green .app,
    body.meeting-mode.state-green .main,
    body.meeting-mode.state-green .timer-card {
      background: var(--signal-green);
    }


    body.meeting-mode.state-yellow,
    body.meeting-mode.state-yellow .app,
    body.meeting-mode.state-yellow .main,
    body.meeting-mode.state-yellow .timer-card {
      background: var(--signal-yellow);
    }


    body.meeting-mode.state-red,
    body.meeting-mode.state-red .app,
    body.meeting-mode.state-red .main,
    body.meeting-mode.state-red .timer-card {
      background: var(--signal-red);
    }


    body.meeting-mode.state-overtime,
    body.meeting-mode.state-overtime .app,
    body.meeting-mode.state-overtime .main,
    body.meeting-mode.state-overtime .timer-card {
      background: var(--true-maroon);
    }


    /* =====================================================
       MOBILE
       ===================================================== */

    @media (max-width: 650px) {

      .custom-grid {
        grid-template-columns:
          1fr
          1fr;
      }

      .apply {
        grid-column: 1 / -1;
      }
    }


    @media (max-width: 400px) {

      .header {
        padding: 8px 10px 6px;
      }

      .header h1 {
        font-size: 19px;
      }

      .header p {
        font-size: 11px;
      }

      .main {
        padding: 6px 8px 10px;
      }

      .preset {
        padding: 8px 13px;

        font-size: 13px;
      }

      .preset span {
        font-size: 12px;
      }

      .timer-card {
        padding: 16px 6px 20px;
      }

      .timer {
        font-size: 75px;
      }

      .signal {
        font-size: 16px;
      }

      .light {
        width: 40px;
        height: 40px;
      }

      button.control {
        font-size: 13px;
      }
    }

  </style>
</head>


<body>

<div class="app">

  <!-- ===================================================
       HEADER
       =================================================== -->

  <header class="header">

    <h1>
      Meeting Timer
    </h1>

    <p>
      Jaipur Speakers Toastmasters Club
    </p>

  </header>


  <main class="main">

    <!-- =================================================
         PRESETS
         ================================================= -->

    <div class="presets">

      <button
        class="preset active"
        data-green="60"
        data-yellow="90"
        data-red="120">

        Table Topics
        <span>(1–2m)</span>

      </button>


      <button
        class="preset"
        data-green="240"
        data-yellow="300"
        data-red="360">

        Icebreaker
        <span>(4–6m)</span>

      </button>


      <button
        class="preset"
        data-green="300"
        data-yellow="360"
        data-red="420">

        Standard Speech
        <span>(5–7m)</span>

      </button>


      <button
        class="preset"
        data-green="120"
        data-yellow="150"
        data-red="180">

        Evaluation
        <span>(2–3m)</span>

      </button>

    </div>


    <!-- =================================================
         SPEAKER
         ================================================= -->

    <input
      id="speaker"
      class="speaker"
      type="text"
      placeholder="Speaker name (optional)"
      autocomplete="off"
    >


    <!-- =================================================
         TIMER
         ================================================= -->

    <section class="timer-card">

      <div
        id="speakerName"
        class="speaker-name">
      </div>


      <div
        id="signal"
        class="signal">

        READY

      </div>


      <div
        id="timer"
        class="timer">

        00:00

      </div>


      <div
        id="timingInfo"
        class="timing-info">

        Green at 01:00 · Yellow at 01:30 · Red at 02:00

      </div>


      <div class="lights">

        <div
          id="greenLight"
          class="light green">
        </div>

        <div
          id="yellowLight"
          class="light yellow">
        </div>

        <div
          id="redLight"
          class="light red">
        </div>

      </div>

    </section>


    <!-- =================================================
         CONTROLS
         ================================================= -->

    <div class="controls">

      <button
        id="start"
        class="control">

        Start

      </button>


      <button
        id="reset"
        class="control maroon">

        Reset

      </button>


      <button
        id="meetingMode"
        class="control">

        Meeting Mode

      </button>


      <button
        id="stop"
        class="control gray">

        Stop

      </button>

    </div>


    <!-- =================================================
         TIME ADJUSTMENT
         ================================================= -->

    <div class="adjust">

      <button id="minus30">
        −30 sec
      </button>

      <button id="plus30">
        +30 sec
      </button>

    </div>


    <!-- =================================================
         CUSTOM TIMING
         ================================================= -->

    <section class="custom">

      <h2>
        Custom Timing
      </h2>


      <div class="custom-grid">

        <div class="field">

          <label for="customGreen">
            Green at (min)
          </label>

          <input
            id="customGreen"
            type="number"
            min="0"
            step="0.5"
            value="5"
          >

        </div>


        <div class="field">

          <label for="customYellow">
            Yellow at (min)
          </label>

          <input
            id="customYellow"
            type="number"
            min="0"
            step="0.5"
            value="6"
          >

        </div>


        <div class="field">

          <label for="customRed">
            Red at (min)
          </label>

          <input
            id="customRed"
            type="number"
            min="0"
            step="0.5"
            value="7"
          >

        </div>


        <button
          id="applyCustom"
          class="apply">

          Apply

        </button>

      </div>

    </section>

  </main>


  <!-- ===================================================
       FOOTER
       =================================================== -->

  <footer class="footer">

    Where Leaders Are Made.

  </footer>

</div>


<script>

  /* =====================================================
     ELEMENTS
     ===================================================== */

  const presets =
    document.querySelectorAll(".preset");

  const timer =
    document.getElementById("timer");

  const signal =
    document.getElementById("signal");

  const timingInfo =
    document.getElementById("timingInfo");

  const speakerInput =
    document.getElementById("speaker");

  const speakerName =
    document.getElementById("speakerName");

  const startButton =
    document.getElementById("start");

  const resetButton =
    document.getElementById("reset");

  const stopButton =
    document.getElementById("stop");

  const meetingModeButton =
    document.getElementById("meetingMode");

  const plus30Button =
    document.getElementById("plus30");

  const minus30Button =
    document.getElementById("minus30");

  const greenLight =
    document.getElementById("greenLight");

  const yellowLight =
    document.getElementById("yellowLight");

  const redLight =
    document.getElementById("redLight");

  const customGreen =
    document.getElementById("customGreen");

  const customYellow =
    document.getElementById("customYellow");

  const customRed =
    document.getElementById("customRed");

  const applyCustom =
    document.getElementById("applyCustom");


  /* =====================================================
     TIMER STATE
     ===================================================== */

  let elapsedSeconds = 0;

  let greenAt = 60;

  let yellowAt = 90;

  let redAt = 120;

  let running = false;

  let interval = null;

  let lastTickTime = null;


  /* =====================================================
     FORMAT
     ===================================================== */

  function formatTime(seconds) {

    const minutes =
      Math.floor(seconds / 60);

    const secondsPart =
      seconds % 60;

    return (
      String(minutes).padStart(2, "0") +
      ":" +
      String(secondsPart).padStart(2, "0")
    );

  }


  /* =====================================================
     CLEAR SIGNAL
     ===================================================== */

  function clearSignalStates() {

    document.body.classList.remove(
      "state-green",
      "state-yellow",
      "state-red",
      "state-overtime"
    );

    greenLight.classList.remove(
      "active"
    );

    yellowLight.classList.remove(
      "active"
    );

    redLight.classList.remove(
      "active"
    );

  }


  /* =====================================================
     UPDATE DISPLAY
     ===================================================== */

  function updateDisplay() {

    clearSignalStates();


    timer.textContent =
      formatTime(elapsedSeconds);


    /* BEFORE GREEN */

    if (
      elapsedSeconds < greenAt
    ) {

      signal.textContent =
        "READY";

      timingInfo.textContent =
        "Green at " +
        formatTime(greenAt);

    }


    /* GREEN */

    else if (
      elapsedSeconds < yellowAt
    ) {

      document.body.classList.add(
        "state-green"
      );

      greenLight.classList.add(
        "active"
      );

      signal.textContent =
        "GREEN";

      timingInfo.textContent =
        "Yellow at " +
        formatTime(yellowAt) +
        " · Red at " +
        formatTime(redAt);

    }


    /* YELLOW */

    else if (
      elapsedSeconds < redAt
    ) {

      document.body.classList.add(
        "state-yellow"
      );

      yellowLight.classList.add(
        "active"
      );

      signal.textContent =
        "YELLOW";

      timingInfo.textContent =
        "Red at " +
        formatTime(redAt);

    }


    /* RED */

    else {

      document.body.classList.add(
        "state-red"
      );

      redLight.classList.add(
        "active"
      );

      signal.textContent =
        "RED";

      timingInfo.textContent =
        "Time limit reached";


      /* OVERTIME */

      if (
        elapsedSeconds > redAt
      ) {

        document.body.classList.remove(
          "state-red"
        );

        document.body.classList.add(
          "state-overtime"
        );

        signal.textContent =
          "OVERTIME";

        timingInfo.textContent =
          "Over by " +
          formatTime(
            elapsedSeconds - redAt
          );

      }

    }


    speakerName.textContent =
      speakerInput.value.trim();

  }


  /* =====================================================
     ACCURATE TIMER TICK
     ===================================================== */

  function tick() {

    if (!running) {
      return;
    }

    const now =
      Date.now();

    const actualElapsed =
      Math.floor(
        (now - lastTickTime) / 1000
      );

    if (
      actualElapsed !== elapsedSeconds
    ) {

      elapsedSeconds =
        actualElapsed;

      updateDisplay();

    }

  }


  /* =====================================================
     START / PAUSE
     ===================================================== */

  function toggleTimer() {

    if (running) {

      running = false;

      clearInterval(interval);

      interval = null;

      startButton.textContent =
        "Resume";

      return;

    }


    running = true;

    lastTickTime =
      Date.now() -
      (elapsedSeconds * 1000);

    startButton.textContent =
      "Pause";

    interval =
      setInterval(
        tick,
        200
      );

  }


  /* =====================================================
     STOP
     ===================================================== */

  function stopTimer() {

    running = false;

    clearInterval(interval);

    interval = null;

    startButton.textContent =
      "Start";

  }


  /* =====================================================
     RESET
     ===================================================== */

  function resetTimer() {

    stopTimer();

    elapsedSeconds = 0;

    updateDisplay();

  }


  /* =====================================================
     APPLY TIMING
     ===================================================== */

  function applyTiming(
    green,
    yellow,
    red
  ) {

    if (
      green < 0 ||
      yellow <= green ||
      red <= yellow
    ) {

      alert(
        "Please make sure Green < Yellow < Red."
      );

      return false;

    }

    greenAt = green;

    yellowAt = yellow;

    redAt = red;

    resetTimer();

    return true;

  }


  /* =====================================================
     PRESETS
     ===================================================== */

  presets.forEach(
    (preset) => {

      preset.addEventListener(
        "click",
        () => {

          presets.forEach(
            (button) =>
              button.classList.remove(
                "active"
              )
          );

          preset.classList.add(
            "active"
          );

          applyTiming(
            Number(
              preset.dataset.green
            ),
            Number(
              preset.dataset.yellow
            ),
            Number(
              preset.dataset.red
            )
          );

        }
      );

    }
  );


  /* =====================================================
     CONTROLS
     ===================================================== */

  startButton.addEventListener(
    "click",
    toggleTimer
  );


  stopButton.addEventListener(
    "click",
    stopTimer
  );


  resetButton.addEventListener(
    "click",
    resetTimer
  );


  /* =====================================================
     +30 SECONDS
     ===================================================== */

  plus30Button.addEventListener(
    "click",
    () => {

      elapsedSeconds += 30;

      if (running) {

        lastTickTime =
          Date.now() -
          (elapsedSeconds * 1000);

      }

      updateDisplay();

    }
  );


  /* =====================================================
     -30 SECONDS
     ===================================================== */

  minus30Button.addEventListener(
    "click",
    () => {

      elapsedSeconds =
        Math.max(
          0,
          elapsedSeconds - 30
        );

      if (running) {

        lastTickTime =
          Date.now() -
          (elapsedSeconds * 1000);

      }

      updateDisplay();

    }
  );


  /* =====================================================
     MEETING MODE
     ===================================================== */

  meetingModeButton.addEventListener(
    "click",
    async () => {

      document.body.classList.toggle(
        "meeting-mode"
      );


      const active =
        document.body.classList.contains(
          "meeting-mode"
        );


      meetingModeButton.textContent =
        active
          ? "Exit Meeting Mode"
          : "Meeting Mode";


      /*
       * Try native fullscreen.
       *
       * If FreeToastHost blocks it, the meeting
       * mode above still works perfectly.
       */

      if (
        active &&
        !document.fullscreenElement &&
        document.documentElement.requestFullscreen
      ) {

        try {

          await document.documentElement
            .requestFullscreen();

        }

        catch (error) {

          /*
           * Expected in some iframe environments.
           * Meeting Mode continues without fullscreen.
           */

          console.log(
            "Native fullscreen unavailable."
          );

        }

      }

    }
  );


  /* =====================================================
     EXIT NATIVE FULLSCREEN
     ===================================================== */

  document.addEventListener(
    "fullscreenchange",
    () => {

      if (
        !document.fullscreenElement &&
        document.body.classList.contains(
          "meeting-mode"
        )
      ) {

        /*
         * Keep Meeting Mode active even if
         * native fullscreen is unavailable.
         */

        return;

      }

    }
  );


  /* =====================================================
     SPEAKER
     ===================================================== */

  speakerInput.addEventListener(
    "input",
    updateDisplay
  );


  /* =====================================================
     CUSTOM TIMING
     ===================================================== */

  applyCustom.addEventListener(
    "click",
    () => {

      const green =
        Number(
          customGreen.value
        ) * 60;

      const yellow =
        Number(
          customYellow.value
        ) * 60;

      const red =
        Number(
          customRed.value
        ) * 60;


      presets.forEach(
        (button) =>
          button.classList.remove(
            "active"
          )
      );


      applyTiming(
        green,
        yellow,
        red
      );

    }
  );


  /* =====================================================
     KEYBOARD SHORTCUTS
     ===================================================== */

  document.addEventListener(
    "keydown",
    (event) => {

      if (
        event.target.tagName === "INPUT"
      ) {
        return;
      }


      if (
        event.code === "Space"
      ) {

        event.preventDefault();

        toggleTimer();

      }


      if (
        event.code === "KeyR"
      ) {

        resetTimer();

      }


      if (
        event.code === "KeyM"
      ) {

        meetingModeButton.click();

      }

    }
  );


  /* =====================================================
     INITIAL STATE
     ===================================================== */

  applyTiming(
    60,
    90,
    120
  );

</script>

</body>
</html>
