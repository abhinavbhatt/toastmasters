<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#004165">

  <title>Toastmasters Timer | Jaipur Speakers</title>

  <style>
    :root {
      --loyal-blue: #004165;
      --true-maroon: #772432;
      --cool-gray: #A9B2B1;
      --white: #FFFFFF;
      --black: #222222;

      --signal-green: #3F7D20;
      --signal-yellow: #D99A00;
      --signal-red: #C62828;

      --light-bg: #F4F5F5;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      font-family: "Source Sans 3", "Source Sans Pro", Arial, sans-serif;
      background: var(--light-bg);
      color: var(--black);
      transition: background-color 0.3s ease;
    }

    /* =====================================================
       NORMAL VIEW
       ===================================================== */

    .app {
      width: 100%;
      min-height: 100vh;
      max-width: 900px;
      margin: 0 auto;

      background: var(--white);

      transition:
        background-color 0.3s ease,
        color 0.3s ease;
    }

    .header {
      background: var(--loyal-blue);
      color: var(--white);
      text-align: center;
      padding: 18px 12px;
    }

    .header h1 {
      margin: 0;
      font-size: clamp(23px, 6vw, 38px);
      line-height: 1.05;
    }

    .header p {
      margin: 6px 0 0;
      font-size: 16px;
    }

    .main {
      width: 100%;
      padding: 14px;

      background: var(--white);

      transition: background-color 0.3s ease;
    }

    /* =====================================================
       PRESETS
       ===================================================== */

    .presets {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 12px;
    }

    .preset {
      min-height: 62px;
      padding: 9px 6px;

      border: 2px solid var(--loyal-blue);

      background: var(--white);
      color: var(--loyal-blue);

      font: inherit;
      font-size: 14px;
      font-weight: 700;

      cursor: pointer;
      touch-action: manipulation;
    }

    .preset.active {
      background: var(--loyal-blue);
      color: var(--white);
    }

    .preset span {
      display: block;
      margin-top: 3px;
      font-size: 11px;
      font-weight: 400;
    }

    /* =====================================================
       SPEAKER
       ===================================================== */

    .speaker {
      width: 100%;
      margin-bottom: 12px;
      padding: 13px;

      border: 2px solid var(--cool-gray);

      background: var(--white);
      color: var(--black);

      font: inherit;
      font-size: 17px;

      outline: none;
    }

    /* =====================================================
       TIMER
       ===================================================== */

    .timer-card {
      width: 100%;
      padding: 22px 10px 24px;

      border: 7px solid var(--loyal-blue);

      background: var(--white);

      text-align: center;

      transition:
        background-color 0.3s ease,
        border-color 0.3s ease,
        color 0.3s ease;
    }

    .speaker-name {
      min-height: 28px;

      color: var(--loyal-blue);

      font-size: 20px;
      font-weight: 700;
    }

    .signal {
      min-height: 29px;
      margin-top: 4px;

      color: var(--loyal-blue);

      font-size: 18px;
      font-weight: 800;

      letter-spacing: 0.09em;
      text-transform: uppercase;
    }

    .timer {
      margin: 10px 0;

      color: var(--loyal-blue);

      font-size: clamp(82px, 21vw, 170px);
      font-weight: 800;
      line-height: 0.9;

      font-variant-numeric: tabular-nums;
      letter-spacing: 0.015em;
    }

    .timing-info {
      min-height: 25px;

      color: #555;
      font-size: 15px;
    }

    /* =====================================================
       SIGNAL LIGHTS
       ===================================================== */

    .lights {
      display: flex;
      justify-content: center;
      gap: 12px;

      margin-top: 18px;
    }

    .light {
      width: 46px;
      height: 46px;

      border: 3px solid currentColor;
      border-radius: 50%;

      opacity: 0.16;
    }

    .light.green {
      color: var(--signal-green);
    }

    .light.yellow {
      color: var(--signal-yellow);
    }

    .light.red {
      color: var(--signal-red);
    }

    .light.active {
      opacity: 1;
    }

    .light.green.active {
      background: var(--signal-green);
    }

    .light.yellow.active {
      background: var(--signal-yellow);
    }

    .light.red.active {
      background: var(--signal-red);
    }

  /* =====================================================
   MINIMAL CONTROLS
   ===================================================== */

.controls {
  display: grid;
  grid-template-columns: 2fr 1fr 1fr 1fr;
  gap: 8px;
  margin-top: 10px;
}

button.control {
  min-height: 48px;
  padding: 10px 8px;

  border: 1px solid rgba(0, 0, 0, 0.14);
  border-radius: 4px;

  background: rgba(255, 255, 255, 0.82);
  color: var(--loyal-blue);

  font: inherit;
  font-size: 15px;
  font-weight: 700;

  cursor: pointer;
  touch-action: manipulation;

  transition:
    background-color 0.2s ease,
    border-color 0.2s ease,
    opacity 0.2s ease;
}

button.control:hover {
  background: rgba(255, 255, 255, 0.94);
}

button.control:active {
  background: rgba(255, 255, 255, 1);
}

button.maroon {
  background: rgba(255, 255, 255, 0.82);
  color: var(--true-maroon);
}

button.gray {
  background: rgba(255, 255, 255, 0.68);
  color: var(--black);
}


/* =====================================================
   ADJUSTMENT BUTTONS
   ===================================================== */

.adjust {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-top: 8px;
}

.adjust button {
  min-height: 42px;
  padding: 9px;

  border: 1px solid rgba(0, 0, 0, 0.12);
  border-radius: 4px;

  background: rgba(255, 255, 255, 0.62);
  color: var(--black);

  font: inherit;
  font-size: 14px;
  font-weight: 600;

  cursor: pointer;
  touch-action: manipulation;

  transition:
    background-color 0.2s ease,
    opacity 0.2s ease;
}

.adjust button:hover {
  background: rgba(255, 255, 255, 0.78);
}

.adjust button:active {
  background: rgba(255, 255, 255, 0.92);
}


/* =====================================================
   SIGNAL STATES
   Keep controls subtle but readable
   ===================================================== */

body.state-green .controls button,
body.state-yellow .controls button,
body.state-red .controls button,
body.state-overtime .controls button,
body.state-green .adjust button,
body.state-yellow .adjust button,
body.state-red .adjust button,
body.state-overtime .adjust button {
  background: rgba(255, 255, 255, 0.82);
  color: var(--black);
}

body.state-green .controls button:first-child,
body.state-yellow .controls button:first-child,
body.state-red .controls button:first-child,
body.state-overtime .controls button:first-child {
  font-weight: 800;
}


/* =====================================================
   MOBILE
   ===================================================== */

@media (max-width: 650px) {

  .controls {
    grid-template-columns: 1.5fr 1fr 1fr 1fr;
    gap: 6px;
  }

  button.control {
    min-height: 44px;
    padding: 8px 5px;
    font-size: 14px;
  }

  .adjust {
    gap: 6px;
  }

  .adjust button {
    min-height: 38px;
    font-size: 13px;
  }
}
    /* =====================================================
       WHOLE PAGE SIGNAL STATES
       ===================================================== */

    body.state-green,
    body.state-yellow,
    body.state-red,
    body.state-overtime {
      min-height: 100vh;
    }

    /* GREEN */

    body.state-green {
      background: var(--signal-green);
    }

    body.state-green .app,
    body.state-green .main {
      background: var(--signal-green);
    }

    body.state-green .timer-card {
      background: var(--signal-green);
      border-color: var(--white);
    }

    body.state-green .speaker-name,
    body.state-green .signal,
    body.state-green .timer,
    body.state-green .timing-info {
      color: var(--white);
    }

    /* YELLOW */

    body.state-yellow {
      background: var(--signal-yellow);
    }

    body.state-yellow .app,
    body.state-yellow .main {
      background: var(--signal-yellow);
    }

    body.state-yellow .timer-card {
      background: var(--signal-yellow);
      border-color: var(--white);
    }

    body.state-yellow .speaker-name,
    body.state-yellow .signal,
    body.state-yellow .timer,
    body.state-yellow .timing-info {
      color: var(--white);
    }

    /* RED */

    body.state-red {
      background: var(--signal-red);
    }

    body.state-red .app,
    body.state-red .main {
      background: var(--signal-red);
    }

    body.state-red .timer-card {
      background: var(--signal-red);
      border-color: var(--white);
    }

    body.state-red .speaker-name,
    body.state-red .signal,
    body.state-red .timer,
    body.state-red .timing-info {
      color: var(--white);
    }

    /* OVERTIME */

    body.state-overtime {
      background: var(--true-maroon);
    }

    body.state-overtime .app,
    body.state-overtime .main {
      background: var(--true-maroon);
    }

    body.state-overtime .timer-card {
      background: var(--true-maroon);
      border-color: var(--white);
    }

    body.state-overtime .speaker-name,
    body.state-overtime .signal,
    body.state-overtime .timer,
    body.state-overtime .timing-info {
      color: var(--white);
    }

    /* =====================================================
       FULLSCREEN PHONE MODE
       ===================================================== */

    body.fullscreen {
      padding: 0;
      overflow: hidden;
    }

    body.fullscreen .header,
    body.fullscreen .presets,
    body.fullscreen .speaker,
    body.fullscreen .controls,
    body.fullscreen .adjust,
    body.fullscreen .custom,
    body.fullscreen .footer,
    body.fullscreen .timing-info,
    body.fullscreen .lights {
      display: none;
    }

    body.fullscreen .app,
    body.fullscreen .main {
      width: 100%;
      max-width: none;
      min-height: 100vh;

      padding: 0;

      background: transparent;
    }

    body.fullscreen .timer-card {
      width: 100%;
      min-height: 100vh;

      padding: 20px;

      border: 0;

      background: transparent;

      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    body.fullscreen .speaker-name {
      color: var(--white);

      font-size: clamp(22px, 6vw, 42px);
    }

    body.fullscreen .signal {
      color: var(--white);

      font-size: clamp(22px, 7vw, 42px);
    }

    body.fullscreen .timer {
      color: var(--white);

      font-size: clamp(120px, 31vw, 360px);

      line-height: 0.85;

      margin: 20px 0;
    }

    /* In fullscreen, use the state color
       on the entire viewport. */

    body.fullscreen.state-green,
    body.fullscreen.state-green .app,
    body.fullscreen.state-green .main,
    body.fullscreen.state-green .timer-card {
      background: var(--signal-green);
    }

    body.fullscreen.state-yellow,
    body.fullscreen.state-yellow .app,
    body.fullscreen.state-yellow .main,
    body.fullscreen.state-yellow .timer-card {
      background: var(--signal-yellow);
    }

    body.fullscreen.state-red,
    body.fullscreen.state-red .app,
    body.fullscreen.state-red .main,
    body.fullscreen.state-red .timer-card {
      background: var(--signal-red);
    }

    body.fullscreen.state-overtime,
    body.fullscreen.state-overtime .app,
    body.fullscreen.state-overtime .main,
    body.fullscreen.state-overtime .timer-card {
      background: var(--true-maroon);
    }

    /* =====================================================
       MOBILE
       ===================================================== */

    @media (max-width: 650px) {

      .presets {
        grid-template-columns: repeat(2, 1fr);
      }

      .controls {
        grid-template-columns: 1fr 1fr;
      }

      .custom-grid {
        grid-template-columns: 1fr 1fr;
      }

      .apply {
        grid-column: 1 / -1;
      }
    }

    @media (max-width: 400px) {

      .timer {
        font-size: 76px;
      }

      .light {
        width: 40px;
        height: 40px;
      }

      .custom-grid {
        grid-template-columns: 1fr;
      }

      .apply {
        grid-column: auto;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <header class="header">
    <h1>Toastmasters Meeting Timer</h1>
    <p>Jaipur Speakers Toastmasters Club</p>
  </header>

  <main class="main">

    <div class="presets">

      <button
        class="preset active"
        data-green="60"
        data-yellow="90"
        data-red="120">
        Table Topics
        <span>1:00 · 1:30 · 2:00</span>
      </button>

      <button
        class="preset"
        data-green="240"
        data-yellow="300"
        data-red="360">
        Icebreaker
        <span>4:00 · 5:00 · 6:00</span>
      </button>

      <button
        class="preset"
        data-green="300"
        data-yellow="360"
        data-red="420">
        Prepared Speech
        <span>5:00 · 6:00 · 7:00</span>
      </button>

      <button
        class="preset"
        data-green="120"
        data-yellow="150"
        data-red="180">
        Evaluation
        <span>2:00 · 2:30 · 3:00</span>
      </button>

    </div>

    <input
      id="speaker"
      class="speaker"
      type="text"
      placeholder="Speaker name (optional)"
      autocomplete="off"
    >

    <section class="timer-card">

      <div
        id="speakerName"
        class="speaker-name">
      </div>

      <div
        id="signal"
        class="signal">
        READY
      </div>

      <div
        id="timer"
        class="timer">
        00:00
      </div>

      <div
        id="timingInfo"
        class="timing-info">
        Green at 1:00 · Yellow at 1:30 · Red at 2:00
      </div>

      <div class="lights">

        <div
          id="greenLight"
          class="light green">
        </div>

        <div
          id="yellowLight"
          class="light yellow">
        </div>

        <div
          id="redLight"
          class="light red">
        </div>

      </div>

    </section>

    <div class="controls">

      <button
        id="start"
        class="control">
        Start
      </button>

      <button
        id="reset"
        class="control maroon">
        Reset
      </button>

      <button
        id="fullscreen"
        class="control gray">
        Fullscreen
      </button>

      <button
        id="stop"
        class="control gray">
        Stop
      </button>

    </div>

    <div class="adjust">

      <button id="minus30">
        −30 sec
      </button>

      <button id="plus30">
        +30 sec
      </button>

    </div>

    <section class="custom">

      <h2>Custom Timing</h2>

      <div class="custom-grid">

        <div class="field">
          <label for="customGreen">
            Green at (min)
          </label>

          <input
            id="customGreen"
            type="number"
            min="0"
            step="0.5"
            value="5">
        </div>

        <div class="field">
          <label for="customYellow">
            Yellow at (min)
          </label>

          <input
            id="customYellow"
            type="number"
            min="0"
            step="0.5"
            value="6">
        </div>

        <div class="field">
          <label for="customRed">
            Red at (min)
          </label>

          <input
            id="customRed"
            type="number"
            min="0"
            step="0.5"
            value="7">
        </div>

        <button
          id="applyCustom"
          class="apply">
          Apply
        </button>

      </div>

    </section>

  </main>

  <footer class="footer">
    Where Leaders Are Made.
  </footer>

</div>


<script>

  const presets =
    document.querySelectorAll(".preset");

  const timer =
    document.getElementById("timer");

  const signal =
    document.getElementById("signal");

  const timingInfo =
    document.getElementById("timingInfo");

  const speakerInput =
    document.getElementById("speaker");

  const speakerName =
    document.getElementById("speakerName");

  const startButton =
    document.getElementById("start");

  const resetButton =
    document.getElementById("reset");

  const stopButton =
    document.getElementById("stop");

  const fullscreenButton =
    document.getElementById("fullscreen");

  const plus30Button =
    document.getElementById("plus30");

  const minus30Button =
    document.getElementById("minus30");

  const greenLight =
    document.getElementById("greenLight");

  const yellowLight =
    document.getElementById("yellowLight");

  const redLight =
    document.getElementById("redLight");

  const customGreen =
    document.getElementById("customGreen");

  const customYellow =
    document.getElementById("customYellow");

  const customRed =
    document.getElementById("customRed");

  const applyCustom =
    document.getElementById("applyCustom");


  let elapsedSeconds = 0;

  let greenAt = 60;
  let yellowAt = 90;
  let redAt = 120;

  let running = false;
  let interval = null;


  function formatTime(seconds) {

    const minutes =
      Math.floor(seconds / 60);

    const secs =
      seconds % 60;

    return (
      String(minutes).padStart(2, "0") +
      ":" +
      String(secs).padStart(2, "0")
    );
  }


  function clearStates() {

    document.body.classList.remove(
      "state-green",
      "state-yellow",
      "state-red",
      "state-overtime"
    );

    greenLight.classList.remove("active");
    yellowLight.classList.remove("active");
    redLight.classList.remove("active");
  }


  function updateDisplay() {

    clearStates();

    timer.textContent =
      formatTime(elapsedSeconds);


    if (elapsedSeconds < greenAt) {

      signal.textContent =
        "READY";

      timingInfo.textContent =
        "Green at " +
        formatTime(greenAt);

    }

    else if (elapsedSeconds < yellowAt) {

      document.body.classList.add(
        "state-green"
      );

      greenLight.classList.add(
        "active"
      );

      signal.textContent =
        "GREEN";

      timingInfo.textContent =
        "Yellow at " +
        formatTime(yellowAt) +
        " · Red at " +
        formatTime(redAt);

    }

    else if (elapsedSeconds < redAt) {

      document.body.classList.add(
        "state-yellow"
      );

      yellowLight.classList.add(
        "active"
      );

      signal.textContent =
        "YELLOW";

      timingInfo.textContent =
        "Red at " +
        formatTime(redAt);

    }

    else {

      document.body.classList.add(
        "state-red"
      );

      redLight.classList.add(
        "active"
      );

      signal.textContent =
        "RED";

      timingInfo.textContent =
        "Time limit reached";


      if (elapsedSeconds > redAt) {

        document.body.classList.remove(
          "state-red"
        );

        document.body.classList.add(
          "state-overtime"
        );

        signal.textContent =
          "OVERTIME";

        timingInfo.textContent =
          "Over by " +
          formatTime(
            elapsedSeconds - redAt
          );

      }

    }


    speakerName.textContent =
      speakerInput.value.trim();

  }


  function tick() {

    elapsedSeconds++;

    updateDisplay();

  }


  function toggleTimer() {

    if (running) {

      running = false;

      clearInterval(interval);

      interval = null;

      startButton.textContent =
        "Resume";

      return;

    }


    running = true;

    startButton.textContent =
      "Pause";

    interval =
      setInterval(
        tick,
        1000
      );

  }


  function stopTimer() {

    running = false;

    clearInterval(interval);

    interval = null;

    startButton.textContent =
      "Start";

  }


  function resetTimer() {

    stopTimer();

    elapsedSeconds = 0;

    updateDisplay();

  }


  function applyTiming(
    green,
    yellow,
    red
  ) {

    if (
      green < 0 ||
      yellow <= green ||
      red <= yellow
    ) {

      alert(
        "Please make sure Green < Yellow < Red."
      );

      return;

    }

    greenAt = green;
    yellowAt = yellow;
    redAt = red;

    resetTimer();

  }


  presets.forEach(
    (preset) => {

      preset.addEventListener(
        "click",
        () => {

          presets.forEach(
            (button) =>
              button.classList.remove(
                "active"
              )
          );

          preset.classList.add(
            "active"
          );

          applyTiming(
            Number(
              preset.dataset.green
            ),
            Number(
              preset.dataset.yellow
            ),
            Number(
              preset.dataset.red
            )
          );

        }
      );

    }
  );


  startButton.addEventListener(
    "click",
    toggleTimer
  );


  resetButton.addEventListener(
    "click",
    resetTimer
  );


  stopButton.addEventListener(
    "click",
    stopTimer
  );


  plus30Button.addEventListener(
    "click",
    () => {

      elapsedSeconds += 30;

      updateDisplay();

    }
  );


  minus30Button.addEventListener(
    "click",
    () => {

      elapsedSeconds =
        Math.max(
          0,
          elapsedSeconds - 30
        );

      updateDisplay();

    }
  );


  fullscreenButton.addEventListener(
    "click",
    async () => {

      try {

        if (
          !document.fullscreenElement
        ) {

          await document.documentElement
            .requestFullscreen();

        }

        else {

          await document.exitFullscreen();

        }

      }

      catch (error) {

        console.log(
          "Fullscreen unavailable:",
          error
        );

      }

    }
  );


  document.addEventListener(
    "fullscreenchange",
    () => {

      const active =
        Boolean(
          document.fullscreenElement
        );

      document.body.classList.toggle(
        "fullscreen",
        active
      );

      fullscreenButton.textContent =
        active
          ? "Exit Fullscreen"
          : "Fullscreen";

    }
  );


  speakerInput.addEventListener(
    "input",
    updateDisplay
  );


  applyCustom.addEventListener(
    "click",
    () => {

      const green =
        Number(
          customGreen.value
        ) * 60;

      const yellow =
        Number(
          customYellow.value
        ) * 60;

      const red =
        Number(
          customRed.value
        ) * 60;


      presets.forEach(
        (button) =>
          button.classList.remove(
            "active"
          )
      );


      applyTiming(
        green,
        yellow,
        red
      );

    }
  );


  document.addEventListener(
    "keydown",
    (event) => {

      if (
        event.target.tagName === "INPUT"
      ) {
        return;
      }

      if (
        event.code === "Space"
      ) {

        event.preventDefault();

        toggleTimer();

      }

      if (
        event.code === "KeyR"
      ) {

        resetTimer();

      }

      if (
        event.code === "KeyF"
      ) {

        fullscreenButton.click();

      }

    }
  );


  applyTiming(
    60,
    90,
    120
  );

</script>

</body>
</html>
